<!DOCTYPE html>
<html>

<head>
    <title>HireHub - Edit Profile</title>
</head>

<body>

    <h1>HireHub</h1>

    <h2>Edit Profile</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Profile
        </button>

    </form>

    <br>

    <a href="{% url 'profile' %}">
        Back to Profile
    </a>

    <br><br>

    <a href="{% url 'role_home' %}">
        Dashboard
    </a>

</body>

</html>
