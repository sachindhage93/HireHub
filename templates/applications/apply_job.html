<!DOCTYPE html>
<html>

<head>

    <title>HireHub - Apply Job</title>

</head>

<body>

    <h1>HireHub</h1>

    <h2>Apply for Job</h2>

    <hr>

    <h3>{{ job.title }}</h3>

    <p>
        <strong>Company:</strong>
        {{ job.company.name }}
    </p>

    <p>
        <strong>Location:</strong>
        {{ job.location }}
    </p>

    <p>
        <strong>Job Type:</strong>
        {{ job.get_job_type_display }}
    </p>

    <hr>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Submit Application
        </button>

    </form>

    <br>

    <a href="{% url 'job_detail' job.id %}">
        Back to Job
    </a>

    <br><br>

    <a href="{% url 'my_applications' %}">
        My Applications
    </a>

</body>

</html>
