<!DOCTYPE html>
<html>

<head>
    <title>HireHub - Edit Job</title>
</head>

<body>

    <h1>HireHub</h1>

    <h2>Edit Job</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Update Job
        </button>

    </form>

    <br>

    <a href="{% url 'job_detail' job.id %}">
        Back to Job
    </a>

    <br><br>

    <a href="{% url 'job_list' %}">
        Back to Jobs
    </a>

</body>

</html>
