{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireHub | Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body.login-page {
            min-height: 100vh; margin: 0; padding: 24px; box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #eaf2ff 0%, #f5f8ff 55%, #e5efff 100%);
            font-family: Arial, Helvetica, sans-serif;
        }
        .login-card {
            width: 100%; max-width: 440px; box-sizing: border-box; padding: 36px;
            background: #fff; border-radius: 18px;
            box-shadow: 0 14px 45px rgba(25, 55, 110, .13);
        }
        .login-brand { margin: 0; text-align: center; color: #2459c4; font-size: 34px; font-weight: 800; }
        .login-subtitle { margin: 8px 0 28px; text-align: center; color: #64748b; font-size: 14px; }
        .login-card h2 { margin: 0 0 24px; text-align: center; color: #172554; font-size: 23px; }
        .login-field { margin-bottom: 18px; }
        .login-field label { display: block; margin-bottom: 8px; color: #26344d; font-size: 14px; font-weight: 700; }
        .login-field input {
            width: 100%; box-sizing: border-box; padding: 13px 14px; border: 1px solid #d5deeb;
            border-radius: 9px; outline: none; font-size: 15px; background: #fbfdff;
        }
        .login-field input:focus { border-color: #356bd4; box-shadow: 0 0 0 3px rgba(53, 107, 212, .12); }
        .login-role-title { margin: 25px 0 12px; text-align: center; color: #26344d; font-size: 14px; font-weight: 700; }
        .login-role-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .login-role-btn {
            min-height: 54px; padding: 12px 8px; border: 0; border-radius: 9px; color: #fff;
            font-size: 14px; font-weight: 700; cursor: pointer; transition: transform .15s, filter .15s;
        }
        .login-role-btn:hover { transform: translateY(-2px); filter: brightness(.94); }
        .login-seeker-btn { background: #0f766e; }
        .login-recruiter-btn { background: #2563eb; }
        .login-message { margin: 0 0 10px; padding: 11px 12px; border-radius: 8px; background: #fee2e2; color: #991b1b; font-size: 13px; }
        .login-message.success { background: #dcfce7; color: #166534; }
        .login-register { margin: 24px 0 0; text-align: center; color: #64748b; font-size: 14px; }
        .login-register a { color: #2459c4; font-weight: 700; text-decoration: none; }
        .login-register a:hover { text-decoration: underline; }
        @media (max-width: 420px) {
            .login-card { padding: 27px 20px; }
            .login-role-buttons { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="login-page">
    <main class="login-card">
        <h1 class="login-brand">HireHub</h1>
        <p class="login-subtitle">Online Job Portal &amp; Recruitment System</p>
        <h2>Welcome Back!</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="login-message {% if message.tags == 'success' %}success{% endif %}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="login-field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
            </div>
            <div class="login-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>

            <p class="login-role-title">Select Your Login Type</p>
            <div class="login-role-buttons">
                <button type="submit" name="selected_role" value="job_seeker" class="login-role-btn login-seeker-btn">Job Seeker Login</button>
                <button type="submit" name="selected_role" value="recruiter" class="login-role-btn login-recruiter-btn">Recruiter Login</button>
            </div>
        </form>

        <p class="login-register">Don't have an account? <a href="{% url 'register' %}">Register Now</a></p>
    </main>
</body>
</html>
