<!DOCTYPE html>
<html>

<head>
    <title>HireHub - Home</title>
</head>

<body>

    <h1>Welcome to HireHub</h1>

    <h2>Online Job Portal & Recruitment Management System</h2>

    {% if user.is_authenticated %}

        <h3>Welcome, {{ user.username }}!</h3>

        <p>You are successfully logged in.</p>

        <form method="POST" action="{% url 'logout' %}">

            {% csrf_token %}

            <button type="submit">
                Logout
            </button>

        </form>

    {% else %}

        <a href="{% url 'login' %}">
            Login
        </a>

        <br><br>

        <a href="{% url 'register' %}">
            Register
        </a>

    {% endif %}

</body>

</html>
