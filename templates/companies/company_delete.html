<!DOCTYPE html>
<html>

<head>
    <title>HireHub - Delete Company</title>
</head>

<body>

    <h1>HireHub</h1>

    <h2>Delete Company</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ company.name }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>

    <br>

    <a href="{% url 'company_list' %}">
        Cancel
    </a>

</body>

</html>
